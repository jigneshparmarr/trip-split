<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Split">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trip Split</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--label:#000;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--fill:rgba(120,120,128,.12);--glass:rgba(250,250,252,.72);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--card:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.65);
    --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--fill:rgba(120,120,128,.24);--glass:rgba(40,40,44,.66);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000;--card:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--sep:rgba(84,84,88,.65);
  --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--fill:rgba(120,120,128,.24);--glass:rgba(40,40,44,.66);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input,select{font-family:inherit}
button{cursor:pointer}

/* ---------- Login ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;text-align:center}
.app-icon{width:92px;height:92px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#0A84FF,#5E5CE6);box-shadow:0 10px 30px rgba(10,132,255,.35)}
.login h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.login p{color:var(--label2);margin:0 0 22px}
.login input[type=text],.login input[type=password]{width:100%;border:0;border-radius:14px;background:var(--card);color:var(--label);padding:15px 16px;font-size:17px;outline:none;margin-bottom:10px;text-align:center}
.check{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--label2);font-size:14px;margin:8px 0 18px}
.err{color:var(--red)!important;font-size:14px;min-height:20px;margin:12px 0 0!important}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--card);color:var(--blue);margin-top:10px}
.btn.danger{background:var(--card);color:var(--red);margin-top:10px}
.btn.small{display:inline-block;width:auto;padding:8px 14px;border-radius:999px;font-size:14px}

/* ---------- Shell ---------- */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 72%,transparent)}
.top-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 20px 10px;display:flex;justify-content:space-between;align-items:flex-end}
body.wide .top-in{max-width:none;padding-left:28px;padding-right:28px}
.top h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--label2);margin-bottom:2px}
.tools{display:flex;gap:8px;padding-bottom:4px;align-items:center}
.tools button{height:38px;min-width:38px;padding:0 12px;border-radius:999px;border:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--blue);font-size:15px;box-shadow:inset 0 0 0 .5px var(--sep)}
main{max-width:560px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom))}
body.wide main{max-width:none;padding-left:28px;padding-right:28px}
body.nobar main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(92vw,460px);display:flex;padding:6px;border-radius:34px;background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:0 10px 34px rgba(0,0,0,.2),inset 0 0 0 .5px var(--sep);z-index:10}
.tab{flex:1;border:0;background:none;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:28px;font-size:10.5px;font-weight:500;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue);background:var(--fill)}

/* ---------- Components ---------- */
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px}
.amount-card{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:26px 16px}
.amount-card .cur{font-size:30px;color:var(--label2);font-weight:500}
.amount-card input{border:0;outline:none;background:transparent;color:var(--label);font-size:58px;font-weight:700;letter-spacing:-.03em;width:2ch;min-width:2ch;max-width:75%;padding:0;font-variant-numeric:tabular-nums}
.amount-card input::placeholder{color:var(--label2);opacity:.5}
.group{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:6px}
.field{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--sep)}
.field:last-child{border:0}
.field span{flex:0 0 76px}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--label);font-size:17px;text-align:right}
.field input::placeholder{color:var(--label2);opacity:.7}
.gh{font-size:13px;font-weight:400;color:var(--label2);margin:20px 8px 8px}
.gh small{display:block;font-size:12px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:9px 14px;background:var(--card);color:var(--label);font-size:15px;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--blue);color:#fff}
.scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:0 0 auto}
.hint{color:var(--label2);font-size:14px;text-align:center;margin:16px 8px;min-height:20px}
.list{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:.5px solid var(--sep);background:none;color:inherit;font-size:17px;text-align:left}
.row:last-child{border-bottom:0}
.ic{flex:0 0 40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;font-size:20px}
.mid{flex:1;min-width:0}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.dayhead{display:flex;justify-content:space-between;margin:18px 8px 8px;font-size:13px;color:var(--label2)}
.hero{text-align:center;padding:24px 16px}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .s{margin-top:4px}
.empty{text-align:center;color:var(--label2);padding:40px 20px}
.empty b{display:block;font-size:20px;color:var(--label);margin-bottom:6px}
.loading{text-align:center;color:var(--label2);padding:60px 0}

/* ---------- Dashboard (admin) ---------- */
.dash{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--card);border-radius:22px;padding:14px 18px;min-width:0}
.kpi .l{color:var(--label2);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.kpi .n{color:var(--label2);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.accent{background:linear-gradient(135deg,#0A84FF,#5E5CE6);color:#fff}
.kpi.accent .l,.kpi.accent .n{color:rgba(255,255,255,.82)}
.row3{display:grid;grid-template-columns:1fr;gap:16px;min-height:0}
.panel{background:var(--card);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{margin:0 0 10px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-size:12.5px;font-weight:400;color:var(--label2)}
.chart{position:relative;flex:1;min-height:270px}
.pscroll{overflow:auto;flex:1;min-height:0;max-height:420px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 6px;border-bottom:.5px solid var(--sep);text-align:left;font-size:15px}
th{color:var(--label2);font-weight:400;font-size:13px}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--fill);font-size:13px}
.stl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.stl:last-child{border:0}.stl b{font-weight:600}.stl .s{color:var(--label2);font-size:13px}
@media (min-width:1100px){
  .kpis{grid-template-columns:repeat(6,1fr);gap:16px}
  .kpi .v{font-size:clamp(26px,2.2vw,40px)}
  .dash{grid-template-rows:auto 1fr 1fr;min-height:calc(100dvh - 300px)}
  .row3{grid-template-columns:repeat(3,1fr)}
  .chart{min-height:0}
  .pscroll{max-height:none}
  .panel{padding:18px 20px}
}


.dfilter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.fsel{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px;color:var(--label2)}
.fsel select{border:0;background:var(--fill);color:var(--label);border-radius:999px;padding:7px 10px;font-size:14px;outline:none;max-width:42vw}
.dfilter .chips{gap:6px}
.dfilter .chip{padding:7px 12px;font-size:14px}
.fcount{color:var(--label2);font-size:13px}
.fcount b{color:var(--label)}
.fhint{flex-basis:100%;color:var(--label2);font-size:12.5px}
.fright{margin-left:auto;display:flex;gap:12px;align-items:center}

/* ---------- Sheets, toast ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s ease-out}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.kv:last-child{border:0}.kv span:first-child{color:var(--label2)}.kv span:last-child{text-align:right}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-90px);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 28px rgba(0,0,0,.22),inset 0 0 0 .5px var(--sep);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;z-index:50;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.bad{color:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="app-icon">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.1" fill="#fff"/></svg>
    </div>
    <h1>Trip Split</h1>
    <p>Sign in to continue.</p>
    <input id="un" type="text" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Username" required>
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
    <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" hidden>
  <header class="top"><div class="top-in">
    <div><div class="sub" id="tripSub"></div><h1 id="title">Add expense</h1></div>
    <div class="tools">
      <button id="refreshBtn" aria-label="Refresh">↻</button>
      <button id="themeBtn" aria-label="Change theme">◐</button>
      <button id="outBtn">Sign out</button>
    </div>
  </div></header>
  <main id="view"><div class="loading">Loading…</div></main>
  <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
    <button class="tab on" data-tab="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
    <button class="tab" data-tab="dashboard"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Dashboard</button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Expenses</button>
    <button class="tab" data-tab="settle"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Settle</button>
  </nav>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ======= PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW (not a secret) ======= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwehaut0Llbq6e6jHzQgqSKwJXNcvG_OoxMYayS7aZoFvXI5m5APeaxEsk7N3EZKjH7/exec';
/* ============================================================================== */

const $ = s => document.querySelector(s);
const newFilter = () => ({ from: 1, to: null, cats: new Set(), paid: 'all', share: 'all' });
const state = { dFilter: newFilter(), token: '', user: null, data: null, tab: 'add', dayFilter: 'all', form: { paidBy: '', category: '', split: new Set() }, saving: false, charts: {}, timer: null, transfers: [] };
const TITLES = { add: 'Add expense', dashboard: 'Dashboard', history: 'Expenses', settle: 'Settle up' };
const ICONS = { food: '🍽️', stay: '🏨', hotel: '🏨', transport: '🚕', taxi: '🚕', fuel: '⛽', tickets: '🎟️', shopping: '🛍️', activities: '🎡', drinks: '☕', other: '🧾' };
const PALETTE = ['#0A84FF', '#30D158', '#FF9F0A', '#FF453A', '#BF5AF2', '#64D2FF', '#FFD60A', '#FF375F', '#5E5CE6', '#AC8E68'];

const isAdmin = () => !!state.user && state.user.role === 'admin';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = c => ICONS[String(c).toLowerCase()] || '💸';
const r2 = n => Math.round(n * 100) / 100;
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function money(n) {
  const cur = state.data ? state.data.settings.currency : '';
  return cur + Number(n).toLocaleString(cur === '₹' ? 'en-IN' : 'en-US', { maximumFractionDigits: 2, minimumFractionDigits: Number.isInteger(r2(n)) ? 0 : 2 });
}
function moneyR(n) {
  const cur = state.data.settings.currency;
  return cur + Math.round(n).toLocaleString(cur === '₹' ? 'en-IN' : 'en-US');
}
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso) { const d = new Date(iso + 'T00:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function dayDate(d) {
  if (!state.data.settings.startDate) return '?'; // server did not send Day 1 = old Apps Script deployment
  const dt = new Date(state.data.settings.startDate + 'T00:00:00');
  if (isNaN(dt)) return '';
  dt.setDate(dt.getDate() + d - 1);
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function vibrate(ms = 10) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
let toastTimer;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------------- API ---------------- */
async function api(action, payload = {}) {
  if (API_URL.includes('PASTE_YOUR')) throw new Error('App is not connected yet. Paste your Web App URL into index.html.');
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: state.token, ...payload }) }); }
  catch (e) { throw new Error("Can't reach the server. Check your internet connection."); }
  let json;
  try { json = await res.json(); } catch (e) { throw new Error('Unexpected server reply. Check the Web App deployment settings.'); }
  if (!json.ok) {
    const m = json.error || 'Something went wrong';
    if (m.startsWith('AUTH:')) { const msg = m.slice(5).trim(); signOut(msg); throw new Error(msg); }
    throw new Error(m);
  }
  return json;
}

/* ---------------- Theme ---------------- */
function applyTheme() {
  const t = localStorage.getItem('ts_theme') || 'auto', root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#themeColor').content = dark ? '#000000' : '#F2F2F7';
  $('#themeBtn').textContent = { auto: '◐', light: '☀︎', dark: '☾' }[t];
}
$('#themeBtn').onclick = () => {
  const o = ['auto', 'light', 'dark'], c = localStorage.getItem('ts_theme') || 'auto', n = o[(o.indexOf(c) + 1) % 3];
  localStorage.setItem('ts_theme', n); applyTheme(); toast('Theme: ' + n[0].toUpperCase() + n.slice(1));
  if (state.tab === 'dashboard' && isAdmin()) renderDashboard();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); if (state.tab === 'dashboard' && isAdmin()) renderDashboard(); });

/* ---------------- Sign in / out ---------------- */
function showLogin(msg) {
  clearInterval(state.timer); destroyCharts();
  $('#app').hidden = true; $('#login').hidden = false; document.body.classList.remove('wide');
  $('#loginErr').textContent = msg || ''; $('#pw').value = ''; $('#loginBtn').disabled = false; $('#loginBtn').textContent = 'Sign in';
}
function signOut(msg) {
  state.token = ''; state.user = null; state.data = null;
  localStorage.removeItem('ts_token'); sessionStorage.removeItem('ts_token');
  showLogin(typeof msg === 'string' ? msg : '');
}
async function bootstrap(silent) {
  const r = await api('bootstrap');
  state.user = r.user; state.data = r.data;
  if (!isAdmin()) { state.data.expenses = []; state.data.payments = []; }
  if (!silent) enterApp();
}
function enterApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#tabbar').hidden = !isAdmin();
  document.body.classList.toggle('nobar', !isAdmin());
  go(isAdmin() && matchMedia('(min-width:1100px)').matches ? 'dashboard' : 'add');
  clearInterval(state.timer);
  if (isAdmin()) state.timer = setInterval(() => { if (!document.hidden && state.tab === 'dashboard') refresh(true); }, 60000);
}
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = $('#loginBtn'); b.disabled = true; b.textContent = 'Checking…';
  try {
    const r = await api('login', { username: $('#un').value, password: $('#pw').value });
    state.token = r.token;
    (($('#remember').checked) ? localStorage : sessionStorage).setItem('ts_token', r.token);
    await bootstrap(false);
  } catch (e) { state.token = ''; showLogin(e.message); }
});
$('#outBtn').onclick = () => signOut();

/* ---------------- Navigation ---------------- */
function destroyCharts() { Object.values(state.charts).forEach(c => c.destroy()); state.charts = {}; }
function setSub() {
  const s = state.data.settings;
  if (isAdmin() && !s.startDate) { $('#tripSub').textContent = '⚠ Apps Script is not updated: redeploy it as a New version'; return; }

}

/* ---------------- Calculations (admin) ---------------- */
function calc(exps) {
  exps = exps || state.data.expenses;
  const s = state.data.settings, main = s.mainPayer;
  const paid = {}, share = {}, net = {}, byCat = {}, byDay = {};
  const ensure = p => { if (paid[p] === undefined) { paid[p] = 0; share[p] = 0; } };
  s.travellers.forEach(ensure);
  let total = 0, biggest = null;
  exps.forEach(e => {
    const split = e.split.length ? e.split : s.travellers, amt = Number(e.amount);
    total += amt; ensure(e.paidBy); paid[e.paidBy] += amt;
    split.forEach(p => { ensure(p); share[p] += amt / split.length; });
    byCat[e.category] = (byCat[e.category] || 0) + amt;
    byDay[e.day] = (byDay[e.day] || 0) + amt;
    if (!biggest || amt > biggest.amount) biggest = e;
  });
  const people = Object.keys(paid);
  people.forEach(p => net[p] = paid[p] - share[p]);
  state.data.payments.forEach(p => { net[p.from] = (net[p.from] || 0) + Number(p.amount); net[p.to] = (net[p.to] || 0) - Number(p.amount); });
  const transfers = [];
  people.forEach(p => {
    if (p === main) return;
    const b = r2(net[p]);
    if (b < -0.009) transfers.push({ from: p, to: main, amount: -b });
    else if (b > 0.009) transfers.push({ from: main, to: p, amount: b });
  });
  return { paid, share, net, people, total, byCat, byDay, transfers, biggest };
}

async function markPaid(i) {
  const t = state.transfers[i]; if (!t) return;
  if (!confirm(`Record that ${t.from} paid ${t.to} ${money(r2(t.amount))}?`)) return;
  try { const r = await api('addPayment', { payment: { from: t.from, to: t.to, amount: r2(t.amount), date: todayISO() } }); state.data.payments.push(r.payment); state.tab === 'dashboard' ? drawDashBody() : renderSettle(); vibrate(15); toast('Payment recorded'); }
  catch (e) { toast(e.message, true); }
}
async function undoPayment(id) {
  if (!confirm('Remove this recorded payment?')) return;
  try { await api('deletePayment', { id }); state.data.payments = state.data.payments.filter(p => p.id !== id); renderSettle(); toast('Removed'); }
  catch (e) { toast(e.message, true); }
}

/* ---------------- Events ---------------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-tab],[data-grp],[data-open],[data-del],[data-close],[data-pay],[data-delpay],[data-act],[data-dgrp],[data-dact],#saveBtn');
  if (!el) return;
  if (el.dataset.close && ev.target !== el && !el.classList.contains('btn')) return;
  if (el.dataset.tab) return go(el.dataset.tab);
  if (el.id === 'saveBtn') return saveExpense();
  if (el.dataset.grp) {
    const f = state.form, v = el.dataset.v, g = el.dataset.grp;
    if (g === 'day') { state.dayFilter = v === 'all' ? 'all' : Number(v); return renderHistory(); }
    if (g === 'cat') f.category = v;
    if (g === 'paid') f.paidBy = v;
    if (g === 'split') { f.split.has(v) ? f.split.delete(v) : f.split.add(v); }
    el.parentElement.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', g === 'split' ? f.split.has(b.dataset.v) : (g === 'cat' ? f.category : f.paidBy) === b.dataset.v));
    vibrate(6); return updateHint();
  }
  if (!isAdmin()) return; // everything below is admin-only (the server enforces this too)
  if (el.dataset.dgrp === 'cat') { const f = state.dFilter, v = el.dataset.v; f.cats.has(v) ? f.cats.delete(v) : f.cats.add(v); drawDashFilter(); return drawDashBody(); }
  if (el.dataset.dact === 'reset') { state.dFilter = newFilter(); drawDashFilter(); return drawDashBody(); }
  if (el.dataset.open) return openExpense(el.dataset.open);
  if (el.dataset.del) return deleteExpense(el.dataset.del);
  if (el.dataset.close) return closeSheet();
  if (el.dataset.pay) return markPaid(Number(el.dataset.pay));
  if (el.dataset.delpay) return undoPayment(el.dataset.delpay);
  if (el.dataset.act === 'csv') return exportCSV();
});
document.addEventListener('change', ev => {
  const id = ev.target.id;
  if (!isAdmin() || !['dFrom', 'dTo', 'dPaid', 'dShare'].includes(id)) return;
  const f = state.dFilter, max = dashMaxDay(), v = ev.target.value;
  if (id === 'dFrom') { f.from = Number(v); if ((f.to || max) < f.from) f.to = f.from >= max ? null : f.from; }
  if (id === 'dTo') { f.to = Number(v) >= max ? null : Number(v); if (f.to && f.to < f.from) f.from = f.to; }
  if (id === 'dPaid') f.paid = v;
  if (id === 'dShare') f.share = v;
  drawDashFilter(); drawDashBody();
});
document.addEventListener('input', ev => { if (ev.target.id === 'amt') { ev.target.style.width = Math.max(2, ev.target.value.length + 0.5) + 'ch'; updateHint(); } });

/* ---------------- Start ---------------- */
applyTheme();
const saved = localStorage.getItem('ts_token') || sessionStorage.getItem('ts_token');
if (saved) {
  state.token = saved; $('#login').hidden = true;
  bootstrap(false).catch(e => { state.token = ''; localStorage.removeItem('ts_token'); sessionStorage.removeItem('ts_token'); showLogin(/sign in/i.test(e.message) ? '' : e.message); });
}
})();
</script>
